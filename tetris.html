<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>테트리스</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: sans-serif;
      background: #1e1e2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 16px;
    }

    .app {
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }

    .board-wrap {
      position: relative;
    }

    canvas {
      background: #12121c;
      border: 2px solid #444;
      display: block;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: center;
      padding: 16px;
    }

    .overlay.hidden {
      display: none;
    }

    .overlay h2 {
      font-size: 1.3rem;
    }

    button {
      padding: 10px 18px;
      border: 1px solid #666;
      background: #333;
      color: #fff;
      font-size: 0.95rem;
      cursor: pointer;
      border-radius: 4px;
    }

    button:hover {
      background: #444;
    }

    .side {
      width: 180px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .panel {
      background: #2a2a3d;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 14px;
    }

    .panel h3 {
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .panel .value {
      font-size: 1.6rem;
      font-weight: bold;
    }

    .controls-list {
      list-style: none;
      font-size: 0.85rem;
      line-height: 1.7;
      color: #ccc;
    }

    .controls-list span {
      color: #fff;
      font-weight: bold;
    }

    h1 {
      grid-column: 1 / -1;
      text-align: center;
      margin-bottom: 16px;
    }

    .title {
      text-align: center;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div>
    <h1 class="title">테트리스</h1>
    <div class="app">
      <div class="board-wrap">
        <canvas id="board" width="240" height="480"></canvas>
        <div id="overlay" class="overlay">
          <h2>테트리스</h2>
          <button id="startBtn">시작하기</button>
        </div>
      </div>

      <div class="side">
        <div class="panel">
          <h3>점수</h3>
          <div id="score" class="value">0</div>
        </div>
        <div class="panel">
          <h3>줄 수</h3>
          <div id="lines" class="value">0</div>
        </div>
        <div class="panel">
          <h3>다음 블록</h3>
          <canvas id="next" width="96" height="96"></canvas>
        </div>
        <div class="panel">
          <h3>조작법</h3>
          <ul class="controls-list">
            <li><span>←/→</span> 이동</li>
            <li><span>↓</span> 소프트 드롭</li>
            <li><span>↑</span> 회전</li>
            <li><span>Space</span> 즉시 낙하</li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <script>
    const COLS = 10;
    const ROWS = 20;
    const CELL = 24;

    const boardCanvas = document.getElementById("board");
    const boardCtx = boardCanvas.getContext("2d");
    const nextCanvas = document.getElementById("next");
    const nextCtx = nextCanvas.getContext("2d");
    const overlay = document.getElementById("overlay");
    const startBtn = document.getElementById("startBtn");
    const scoreEl = document.getElementById("score");
    const linesEl = document.getElementById("lines");

    const COLORS = {
      I: "#4dd0e1",
      J: "#5c6bc0",
      L: "#ffa726",
      O: "#ffee58",
      S: "#66bb6a",
      T: "#ab47bc",
      Z: "#ef5350"
    };

    const SHAPES = {
      I: [
        [0, 1], [1, 1], [2, 1], [3, 1]
      ],
      J: [
        [0, 0], [0, 1], [1, 1], [2, 1]
      ],
      L: [
        [2, 0], [0, 1], [1, 1], [2, 1]
      ],
      O: [
        [1, 0], [2, 0], [1, 1], [2, 1]
      ],
      S: [
        [1, 0], [2, 0], [0, 1], [1, 1]
      ],
      T: [
        [1, 0], [0, 1], [1, 1], [2, 1]
      ],
      Z: [
        [0, 0], [1, 0], [1, 1], [2, 1]
      ]
    };

    const TYPES = Object.keys(SHAPES);

    let grid = createGrid();
    let current = null;
    let nextType = null;
    let score = 0;
    let lines = 0;
    let dropCounter = 0;
    let dropInterval = 800;
    let lastTime = 0;
    let running = false;
    let gameOverFlag = false;
    let rafId = null;

    function createGrid() {
      return Array.from({ length: ROWS }, function () {
        return Array(COLS).fill(null);
      });
    }

    function randomType() {
      return TYPES[Math.floor(Math.random() * TYPES.length)];
    }

    function createPiece(type) {
      const cells = SHAPES[type].map(function (c) {
        return { x: c[0], y: c[1] };
      });
      return {
        type: type,
        cells: cells,
        x: 3,
        y: -1
      };
    }

    function getOccupied(piece) {
      return piece.cells.map(function (c) {
        return { x: piece.x + c.x, y: piece.y + c.y };
      });
    }

    function collides(piece, offsetX, offsetY, cells) {
      const shape = cells || piece.cells;
      for (let i = 0; i < shape.length; i++) {
        const x = piece.x + shape[i].x + offsetX;
        const y = piece.y + shape[i].y + offsetY;
        if (x < 0 || x >= COLS || y >= ROWS) return true;
        if (y >= 0 && grid[y][x]) return true;
      }
      return false;
    }

    function rotateCells(cells) {
      const minX = Math.min.apply(null, cells.map(function (c) { return c.x; }));
      const maxX = Math.max.apply(null, cells.map(function (c) { return c.x; }));
      const minY = Math.min.apply(null, cells.map(function (c) { return c.y; }));
      const maxY = Math.max.apply(null, cells.map(function (c) { return c.y; }));
      const size = Math.max(maxX - minX, maxY - minY);

      return cells.map(function (c) {
        const relX = c.x - minX;
        const relY = c.y - minY;
        return { x: size - relY, y: relX };
      });
    }

    function tryRotate() {
      if (!current || current.type === "O") return;
      const rotated = rotateCells(current.cells);
      if (!collides(current, 0, 0, rotated)) {
        current.cells = rotated;
        return;
      }
      const kicks = [-1, 1, -2, 2];
      for (let i = 0; i < kicks.length; i++) {
        if (!collides(current, kicks[i], 0, rotated)) {
          current.x += kicks[i];
          current.cells = rotated;
          return;
        }
      }
    }

    function spawnPiece() {
      const type = nextType || randomType();
      nextType = randomType();
      current = createPiece(type);
      drawNext();
      if (collides(current, 0, 0)) {
        endGame();
      }
    }

    function lockPiece() {
      getOccupied(current).forEach(function (cell) {
        if (cell.y >= 0) {
          grid[cell.y][cell.x] = current.type;
        }
      });
      clearLines();
      spawnPiece();
    }

    function clearLines() {
      let cleared = 0;
      for (let y = ROWS - 1; y >= 0; y--) {
        if (grid[y].every(function (cell) { return cell !== null; })) {
          grid.splice(y, 1);
          grid.unshift(Array(COLS).fill(null));
          cleared++;
          y++;
        }
      }
      if (cleared > 0) {
        const points = [0, 100, 300, 500, 800];
        score += points[cleared] || cleared * 200;
        lines += cleared;
        dropInterval = Math.max(120, 800 - lines * 20);
        scoreEl.textContent = score;
        linesEl.textContent = lines;
      }
    }

    function moveCurrent(dx, dy) {
      if (!current) return false;
      if (!collides(current, dx, dy)) {
        current.x += dx;
        current.y += dy;
        return true;
      }
      return false;
    }

    function softDrop() {
      if (!moveCurrent(0, 1)) {
        lockPiece();
      }
      dropCounter = 0;
    }

    function hardDrop() {
      if (!current) return;
      while (moveCurrent(0, 1)) {}
      lockPiece();
      dropCounter = 0;
    }

    function drawCell(ctx, x, y, color, size) {
      ctx.fillStyle = color;
      ctx.fillRect(x * size, y * size, size - 1, size - 1);
    }

    function draw() {
      boardCtx.fillStyle = "#12121c";
      boardCtx.fillRect(0, 0, boardCanvas.width, boardCanvas.height);

      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          const cell = grid[y][x];
          if (cell) {
            drawCell(boardCtx, x, y, COLORS[cell], CELL);
          }
        }
      }

      if (current) {
        getOccupied(current).forEach(function (cell) {
          if (cell.y >= 0) {
            drawCell(boardCtx, cell.x, cell.y, COLORS[current.type], CELL);
          }
        });
      }
    }

    function drawNext() {
      nextCtx.fillStyle = "#2a2a3d";
      nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
      if (!nextType) return;
      const cells = SHAPES[nextType];
      const size = 20;
      const offsetX = nextType === "I" || nextType === "O" ? 0.5 : 0;
      cells.forEach(function (c) {
        drawCell(nextCtx, c[0] + offsetX, c[1], COLORS[nextType], size);
      });
    }

    function endGame() {
      running = false;
      gameOverFlag = true;
      if (rafId) cancelAnimationFrame(rafId);
      overlay.classList.remove("hidden");
      overlay.innerHTML =
        '<h2>게임 오버</h2>' +
        '<p>점수: ' + score + '</p>' +
        '<button id="restartBtn">다시 시작</button>';
      document.getElementById("restartBtn").addEventListener("click", startGame);
    }

    function startGame() {
      grid = createGrid();
      score = 0;
      lines = 0;
      dropInterval = 800;
      dropCounter = 0;
      lastTime = 0;
      scoreEl.textContent = "0";
      linesEl.textContent = "0";
      nextType = randomType();
      spawnPiece();
      overlay.classList.add("hidden");
      running = true;
      gameOverFlag = false;
      if (rafId) cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(update);
    }

    function update(time) {
      if (!running) return;
      const delta = time - lastTime;
      lastTime = time;
      dropCounter += delta;
      if (dropCounter > dropInterval) {
        softDrop();
      }
      draw();
      rafId = requestAnimationFrame(update);
    }

    document.addEventListener("keydown", function (e) {
      if (!running) return;
      switch (e.key) {
        case "ArrowLeft":
          e.preventDefault();
          moveCurrent(-1, 0);
          break;
        case "ArrowRight":
          e.preventDefault();
          moveCurrent(1, 0);
          break;
        case "ArrowDown":
          e.preventDefault();
          softDrop();
          break;
        case "ArrowUp":
          e.preventDefault();
          tryRotate();
          break;
        case " ":
          e.preventDefault();
          hardDrop();
          break;
      }
    });

    startBtn.addEventListener("click", startGame);

    draw();
    drawNext();
  </script>
</body>
</html>
