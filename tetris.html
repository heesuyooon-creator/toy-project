<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>테트리스</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: sans-serif;
      background: #1e1e2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 16px 40px;
      touch-action: manipulation;
    }

    .title {
      text-align: center;
      margin-bottom: 20px;
      font-size: clamp(1.4rem, 5vw, 1.8rem);
    }

    .app {
      display: flex;
      gap: 24px;
      align-items: flex-start;
      flex-wrap: wrap;
      justify-content: center;
    }

    .play-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: min(240px, 70vw);
    }

    .live-hud {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 8px 0;
      background: linear-gradient(180deg, rgba(30, 30, 46, 0.98), rgba(30, 30, 46, 0.9));
    }

    .live-hud .hud-item {
      background: #2a2a3d;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 8px 10px;
      text-align: center;
    }

    .live-hud .label {
      display: block;
      font-size: 0.7rem;
      color: #aaa;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .live-hud .value {
      font-size: 1.25rem;
      font-weight: bold;
      line-height: 1.2;
    }

    .board-wrap {
      position: relative;
      width: 100%;
    }

    canvas#board {
      width: 100%;
      height: auto;
      background: #12121c;
      border: 2px solid #444;
      display: block;
      touch-action: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: center;
      padding: 16px;
    }

    .overlay.hidden {
      display: none;
    }

    .overlay h2 {
      font-size: 1.3rem;
    }

    button {
      padding: 10px 18px;
      border: 1px solid #666;
      background: #333;
      color: #fff;
      font-size: 0.95rem;
      cursor: pointer;
      border-radius: 4px;
      -webkit-tap-highlight-color: transparent;
    }

    button:hover {
      background: #444;
    }

    .pause-btn {
      min-width: 120px;
    }

    .pause-btn.hidden {
      display: none;
    }

    .side {
      width: min(260px, 92vw);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel {
      background: #2a2a3d;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 14px;
    }

    .panel h3 {
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .panel .value {
      font-size: 1.6rem;
      font-weight: bold;
    }

    .guide-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .guide-col h4 {
      font-size: 0.75rem;
      color: #fff;
      margin-bottom: 6px;
    }

    .controls-list {
      list-style: none;
      font-size: 0.8rem;
      line-height: 1.65;
      color: #ccc;
    }

    .controls-list span {
      color: #fff;
      font-weight: bold;
    }

    .mobile-controls {
      display: none;
      width: min(320px, 94vw);
      gap: 8px;
      user-select: none;
    }

    .mobile-controls .row {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    .mobile-controls button {
      min-width: 64px;
      min-height: 52px;
      font-size: 1.1rem;
      font-weight: bold;
    }

    .mobile-controls button.wide {
      min-width: 100px;
    }

    .name-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: min(200px, 85%);
      text-align: left;
    }

    .name-field label {
      font-size: 0.8rem;
      color: #aaa;
    }

    .name-field input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #666;
      border-radius: 4px;
      background: #12121c;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    .name-field input:focus {
      border-color: #aaa;
    }

    .name-error {
      color: #ef5350;
      font-size: 0.8rem;
      min-height: 1.1em;
    }

    .rank-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.85rem;
      color: #ccc;
    }

    .rank-list li {
      display: grid;
      grid-template-columns: 28px 1fr auto;
      gap: 8px;
      align-items: center;
    }

    .rank-list .rank {
      color: #ffee58;
      font-weight: bold;
    }

    .rank-list .name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .rank-list .pts {
      color: #fff;
      font-weight: bold;
    }

    .rank-empty {
      color: #777;
      font-size: 0.85rem;
    }

    .rank-status {
      font-size: 0.72rem;
      color: #777;
      margin-bottom: 8px;
    }

    .rank-status.online {
      color: #66bb6a;
    }

    @media (max-width: 759px) {
      body {
        padding: 8px 10px 20px;
      }

      .title {
        font-size: 1.15rem;
        margin-bottom: 6px;
      }

      .play-col {
        width: min(46vw, 38dvh);
        gap: 8px;
      }

      .live-hud {
        gap: 6px;
        padding: 4px 0;
      }

      .live-hud .hud-item {
        padding: 6px 8px;
      }

      .live-hud .value {
        font-size: 1.05rem;
      }

      .mobile-controls {
        display: flex;
        flex-direction: column;
        width: min(320px, 94vw);
      }

      .mobile-controls button {
        min-width: 58px;
        min-height: 46px;
        font-size: 1rem;
      }

      .pause-btn {
        min-width: 100px;
        padding: 8px 14px;
      }

      .side {
        width: min(320px, 94vw);
      }

      .side .panel.next-panel {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .side .panel.next-panel h3 {
        margin-bottom: 0;
      }
    }

    @media (min-width: 760px) {
      .live-hud {
        position: static;
        background: transparent;
        padding: 0;
      }
    }
  </style>
</head>
<body>
  <div>
    <h1 class="title">테트리스</h1>
    <div class="app">
      <div class="play-col">
        <div class="live-hud" aria-label="현재 상태">
          <div class="hud-item">
            <span class="label">점수</span>
            <span id="score" class="value">0</span>
          </div>
          <div class="hud-item">
            <span class="label">줄 수</span>
            <span id="lines" class="value">0</span>
          </div>
        </div>
        <div class="board-wrap">
          <canvas id="board" width="240" height="480"></canvas>
          <div id="overlay" class="overlay">
            <h2>테트리스</h2>
            <div class="name-field">
              <label for="playerName">플레이어 이름</label>
              <input id="playerName" type="text" maxlength="12" placeholder="이름 입력" autocomplete="nickname" />
              <div id="nameError" class="name-error"></div>
            </div>
            <button id="startBtn" type="button">시작하기</button>
          </div>
        </div>
        <button id="pauseBtn" class="pause-btn hidden" type="button">일시정지</button>
        <div class="mobile-controls" aria-label="모바일 조작">
          <div class="row">
            <button type="button" data-action="left" aria-label="왼쪽">←</button>
            <button type="button" data-action="rotate" aria-label="회전">↻</button>
            <button type="button" data-action="right" aria-label="오른쪽">→</button>
          </div>
          <div class="row">
            <button type="button" data-action="soft" aria-label="소프트 드롭">↓</button>
            <button type="button" class="wide" data-action="hard" aria-label="하드 드롭">떨어뜨리기</button>
          </div>
        </div>
      </div>

      <div class="side">
        <div class="panel next-panel">
          <h3>다음 블록</h3>
          <canvas id="next" width="96" height="96"></canvas>
        </div>
        <div class="panel">
          <h3>랭킹</h3>
          <p id="rankStatus" class="rank-status">랭킹 불러오는 중…</p>
          <ol id="rankList" class="rank-list"></ol>
          <p id="rankEmpty" class="rank-empty">아직 기록이 없어요</p>
        </div>
        <div class="panel">
          <h3>조작법</h3>
          <div class="guide-grid">
            <div class="guide-col">
              <h4>PC</h4>
              <ul class="controls-list">
                <li><span>←/→</span> 이동</li>
                <li><span>↓</span> 소프트 드롭</li>
                <li><span>↑</span> 회전</li>
                <li><span>Space</span> 즉시 낙하</li>
                <li><span>P / Esc</span> 일시정지</li>
              </ul>
            </div>
            <div class="guide-col">
              <h4>모바일</h4>
              <ul class="controls-list">
                <li><span>←/→</span> 이동</li>
                <li><span>↻</span> 회전</li>
                <li><span>↓</span> 소프트 드롭</li>
                <li><span>떨어뜨리기</span> 즉시 낙하</li>
                <li><span>일시정지</span> 버튼</li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="leaderboard.js"></script>
  <script>
    const COLS = 10;
    const ROWS = 20;
    const CELL = 24;

    const GAME_ID = "tetris";
    const NAME_KEY = "tetrisPlayerName";

    const boardCanvas = document.getElementById("board");
    const boardCtx = boardCanvas.getContext("2d");
    const nextCanvas = document.getElementById("next");
    const nextCtx = nextCanvas.getContext("2d");
    const overlay = document.getElementById("overlay");
    const pauseBtn = document.getElementById("pauseBtn");
    const scoreEl = document.getElementById("score");
    const linesEl = document.getElementById("lines");
    const rankListEl = document.getElementById("rankList");
    const rankEmptyEl = document.getElementById("rankEmpty");
    const rankStatusEl = document.getElementById("rankStatus");

    const COLORS = {
      I: "#4dd0e1",
      J: "#5c6bc0",
      L: "#ffa726",
      O: "#ffee58",
      S: "#66bb6a",
      T: "#ab47bc",
      Z: "#ef5350"
    };

    const SHAPES = {
      I: [
        [0, 1], [1, 1], [2, 1], [3, 1]
      ],
      J: [
        [0, 0], [0, 1], [1, 1], [2, 1]
      ],
      L: [
        [2, 0], [0, 1], [1, 1], [2, 1]
      ],
      O: [
        [1, 0], [2, 0], [1, 1], [2, 1]
      ],
      S: [
        [1, 0], [2, 0], [0, 1], [1, 1]
      ],
      T: [
        [1, 0], [0, 1], [1, 1], [2, 1]
      ],
      Z: [
        [0, 0], [1, 0], [1, 1], [2, 1]
      ]
    };

    const TYPES = Object.keys(SHAPES);

    let grid = createGrid();
    let current = null;
    let nextType = null;
    let score = 0;
    let lines = 0;
    let dropCounter = 0;
    let dropInterval = 800;
    let lastTime = 0;
    let running = false;
    let paused = false;
    let gameOverFlag = false;
    let rafId = null;
    let playerName = localStorage.getItem(NAME_KEY) || "";

    function paintRankings(list) {
      rankListEl.innerHTML = "";
      if (!list.length) {
        rankEmptyEl.style.display = "block";
        return;
      }
      rankEmptyEl.style.display = "none";
      list.forEach(function (entry, i) {
        const li = document.createElement("li");
        li.innerHTML =
          '<span class="rank">' + (i + 1) + "</span>" +
          '<span class="name"></span>' +
          '<span class="pts"></span>';
        li.querySelector(".name").textContent = entry.name;
        li.querySelector(".pts").textContent = entry.score;
        rankListEl.appendChild(li);
      });
    }

    async function updateRankStatus() {
      const online = await ToyLeaderboard.isOnline();
      rankStatusEl.textContent = online ? "전체 공유 랭킹 (Supabase)" : "이 기기 랭킹 (연결 대기)";
      rankStatusEl.classList.toggle("online", online);
    }

    async function renderRankings() {
      const list = await ToyLeaderboard.fetchRankings(GAME_ID);
      paintRankings(list);
      await updateRankStatus();
    }

    async function addRanking(name, pts) {
      const list = await ToyLeaderboard.submitScore(GAME_ID, name, pts);
      paintRankings(list);
      await updateRankStatus();
    }

    function bindStartUi() {
      const startBtn = document.getElementById("startBtn");
      const nameInput = document.getElementById("playerName");
      if (nameInput) {
        nameInput.value = playerName;
        nameInput.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            e.preventDefault();
            startGame();
          }
        });
      }
      if (startBtn) startBtn.addEventListener("click", startGame);
    }

    function showStartScreen(message) {
      overlay.classList.remove("hidden");
      overlay.innerHTML =
        "<h2>테트리스</h2>" +
        (message ? "<p>" + message + "</p>" : "") +
        '<div class="name-field">' +
        '<label for="playerName">플레이어 이름</label>' +
        '<input id="playerName" type="text" maxlength="12" placeholder="이름 입력" autocomplete="nickname" />' +
        '<div id="nameError" class="name-error"></div>' +
        "</div>" +
        '<button id="startBtn" type="button">시작하기</button>';
      bindStartUi();
    }

    function createGrid() {
      return Array.from({ length: ROWS }, function () {
        return Array(COLS).fill(null);
      });
    }

    function randomType() {
      return TYPES[Math.floor(Math.random() * TYPES.length)];
    }

    function createPiece(type) {
      const cells = SHAPES[type].map(function (c) {
        return { x: c[0], y: c[1] };
      });
      return {
        type: type,
        cells: cells,
        x: 3,
        y: -1
      };
    }

    function getOccupied(piece) {
      return piece.cells.map(function (c) {
        return { x: piece.x + c.x, y: piece.y + c.y };
      });
    }

    function collides(piece, offsetX, offsetY, cells) {
      const shape = cells || piece.cells;
      for (let i = 0; i < shape.length; i++) {
        const x = piece.x + shape[i].x + offsetX;
        const y = piece.y + shape[i].y + offsetY;
        if (x < 0 || x >= COLS || y >= ROWS) return true;
        if (y >= 0 && grid[y][x]) return true;
      }
      return false;
    }

    function rotateCells(cells) {
      const minX = Math.min.apply(null, cells.map(function (c) { return c.x; }));
      const maxX = Math.max.apply(null, cells.map(function (c) { return c.x; }));
      const minY = Math.min.apply(null, cells.map(function (c) { return c.y; }));
      const maxY = Math.max.apply(null, cells.map(function (c) { return c.y; }));
      const size = Math.max(maxX - minX, maxY - minY);

      return cells.map(function (c) {
        const relX = c.x - minX;
        const relY = c.y - minY;
        return { x: size - relY, y: relX };
      });
    }

    function tryRotate() {
      if (!current || current.type === "O") return;
      const rotated = rotateCells(current.cells);
      if (!collides(current, 0, 0, rotated)) {
        current.cells = rotated;
        return;
      }
      const kicks = [-1, 1, -2, 2];
      for (let i = 0; i < kicks.length; i++) {
        if (!collides(current, kicks[i], 0, rotated)) {
          current.x += kicks[i];
          current.cells = rotated;
          return;
        }
      }
    }

    function spawnPiece() {
      const type = nextType || randomType();
      nextType = randomType();
      current = createPiece(type);
      drawNext();
      if (collides(current, 0, 0)) {
        endGame();
      }
    }

    function lockPiece() {
      getOccupied(current).forEach(function (cell) {
        if (cell.y >= 0) {
          grid[cell.y][cell.x] = current.type;
        }
      });
      clearLines();
      spawnPiece();
    }

    function clearLines() {
      let cleared = 0;
      for (let y = ROWS - 1; y >= 0; y--) {
        if (grid[y].every(function (cell) { return cell !== null; })) {
          grid.splice(y, 1);
          grid.unshift(Array(COLS).fill(null));
          cleared++;
          y++;
        }
      }
      if (cleared > 0) {
        const points = [0, 100, 300, 500, 800];
        score += points[cleared] || cleared * 200;
        lines += cleared;
        dropInterval = Math.max(120, 800 - lines * 20);
        scoreEl.textContent = score;
        linesEl.textContent = lines;
      }
    }

    function moveCurrent(dx, dy) {
      if (!current || paused) return false;
      if (!collides(current, dx, dy)) {
        current.x += dx;
        current.y += dy;
        return true;
      }
      return false;
    }

    function softDrop() {
      if (paused) return;
      if (!moveCurrent(0, 1)) {
        lockPiece();
      }
      dropCounter = 0;
    }

    function hardDrop() {
      if (!current || paused) return;
      while (moveCurrent(0, 1)) {}
      lockPiece();
      dropCounter = 0;
    }

    function drawCell(ctx, x, y, color, size) {
      ctx.fillStyle = color;
      ctx.fillRect(x * size, y * size, size - 1, size - 1);
    }

    function draw() {
      boardCtx.fillStyle = "#12121c";
      boardCtx.fillRect(0, 0, boardCanvas.width, boardCanvas.height);

      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          const cell = grid[y][x];
          if (cell) {
            drawCell(boardCtx, x, y, COLORS[cell], CELL);
          }
        }
      }

      if (current) {
        getOccupied(current).forEach(function (cell) {
          if (cell.y >= 0) {
            drawCell(boardCtx, cell.x, cell.y, COLORS[current.type], CELL);
          }
        });
      }
    }

    function drawNext() {
      nextCtx.fillStyle = "#2a2a3d";
      nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
      if (!nextType) return;
      const cells = SHAPES[nextType];
      const size = 20;
      const offsetX = nextType === "I" || nextType === "O" ? 0.5 : 0;
      cells.forEach(function (c) {
        drawCell(nextCtx, c[0] + offsetX, c[1], COLORS[nextType], size);
      });
    }

    function updatePauseUi() {
      if (!running || gameOverFlag) {
        pauseBtn.classList.add("hidden");
        return;
      }
      pauseBtn.classList.remove("hidden");
      pauseBtn.textContent = paused ? "계속하기" : "일시정지";
    }

    function showPauseOverlay() {
      overlay.classList.remove("hidden");
      overlay.innerHTML =
        "<h2>일시정지</h2>" +
        "<p>준비가 되면 계속하세요</p>" +
        '<button id="resumeBtn" type="button">계속하기</button>';
      document.getElementById("resumeBtn").addEventListener("click", resumeGame);
    }

    async function endGame() {
      running = false;
      paused = false;
      gameOverFlag = true;
      if (rafId) cancelAnimationFrame(rafId);
      updatePauseUi();
      await addRanking(playerName, score);
      showStartScreen(playerName + "님 점수 " + score + "점!");
      const restartBtn = document.createElement("button");
      restartBtn.id = "restartBtn";
      restartBtn.type = "button";
      restartBtn.textContent = "같은 이름으로 다시";
      overlay.appendChild(restartBtn);
      restartBtn.addEventListener("click", startGame);
    }

    function startGame() {
      const nameInput = document.getElementById("playerName");
      const nameError = document.getElementById("nameError");
      const name = nameInput ? nameInput.value.trim() : playerName.trim();
      if (!name) {
        if (nameError) nameError.textContent = "이름을 입력해주세요";
        if (nameInput) nameInput.focus();
        return;
      }
      playerName = name.slice(0, 12);
      localStorage.setItem(NAME_KEY, playerName);
      if (nameError) nameError.textContent = "";

      grid = createGrid();
      score = 0;
      lines = 0;
      dropInterval = 800;
      dropCounter = 0;
      lastTime = 0;
      paused = false;
      scoreEl.textContent = "0";
      linesEl.textContent = "0";
      nextType = randomType();
      spawnPiece();
      overlay.classList.add("hidden");
      running = true;
      gameOverFlag = false;
      updatePauseUi();
      if (rafId) cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(update);
    }

    function pauseGame() {
      if (!running || paused || gameOverFlag) return;
      paused = true;
      updatePauseUi();
      showPauseOverlay();
    }

    function resumeGame() {
      if (!running || !paused) return;
      paused = false;
      lastTime = 0;
      dropCounter = 0;
      overlay.classList.add("hidden");
      updatePauseUi();
      if (rafId) cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(update);
    }

    function togglePause() {
      if (!running || gameOverFlag) return;
      if (paused) resumeGame();
      else pauseGame();
    }

    function update(time) {
      if (!running) return;
      if (paused) {
        draw();
        return;
      }
      const delta = time - lastTime;
      lastTime = time;
      dropCounter += delta;
      if (dropCounter > dropInterval) {
        softDrop();
      }
      draw();
      rafId = requestAnimationFrame(update);
    }

    function canControl() {
      return running && !paused && !gameOverFlag;
    }

    document.addEventListener("keydown", function (e) {
      if (e.key === "p" || e.key === "P" || e.key === "Escape") {
        if (running && !gameOverFlag) {
          e.preventDefault();
          togglePause();
        }
        return;
      }
      if (!canControl()) return;
      switch (e.key) {
        case "ArrowLeft":
          e.preventDefault();
          moveCurrent(-1, 0);
          break;
        case "ArrowRight":
          e.preventDefault();
          moveCurrent(1, 0);
          break;
        case "ArrowDown":
          e.preventDefault();
          softDrop();
          break;
        case "ArrowUp":
          e.preventDefault();
          tryRotate();
          break;
        case " ":
          e.preventDefault();
          hardDrop();
          break;
      }
    });

    document.querySelectorAll(".mobile-controls button").forEach(function (btn) {
      btn.addEventListener("pointerdown", function (e) {
        e.preventDefault();
        if (!canControl()) return;
        const action = btn.getAttribute("data-action");
        if (action === "left") moveCurrent(-1, 0);
        if (action === "right") moveCurrent(1, 0);
        if (action === "rotate") tryRotate();
        if (action === "soft") softDrop();
        if (action === "hard") hardDrop();
        draw();
      });
    });

    pauseBtn.addEventListener("click", togglePause);

    renderRankings();
    bindStartUi();
    draw();
    drawNext();
  </script>
</body>
</html>
