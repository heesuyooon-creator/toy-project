<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>네온 스네이크</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    @keyframes bgShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes titleGlow {
      0%, 100% { text-shadow: 0 0 10px #0ff, 0 0 20px #0ff, 0 0 40px #f0f; }
      50% { text-shadow: 0 0 20px #f0f, 0 0 40px #f0f, 0 0 60px #0ff; }
    }

    body {
      font-family: "Segoe UI", sans-serif;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 24px 16px 40px;
      background: linear-gradient(120deg, #0b0221, #1a0533, #05021a, #250040);
      background-size: 400% 400%;
      animation: bgShift 12s ease infinite;
      touch-action: manipulation;
    }

    h1.title {
      font-size: clamp(1.5rem, 5vw, 2rem);
      letter-spacing: 0.1em;
      margin-bottom: 20px;
      color: #fff;
      animation: titleGlow 2.5s ease-in-out infinite;
    }

    .app {
      display: flex;
      gap: 24px;
      align-items: flex-start;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      max-width: 760px;
    }

    .play-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: min(400px, 92vw);
    }

    .live-hud {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 8px 0;
      background: linear-gradient(180deg, rgba(11, 2, 33, 0.96), rgba(11, 2, 33, 0.88));
      backdrop-filter: blur(6px);
    }

    .live-hud .hud-item {
      background: rgba(20, 8, 40, 0.85);
      border: 1px solid #f0f;
      border-radius: 8px;
      padding: 8px 10px;
      text-align: center;
      box-shadow: 0 0 8px rgba(255, 0, 255, 0.25);
    }

    .live-hud .label {
      display: block;
      font-size: 0.68rem;
      color: #d9a3ff;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .live-hud .value {
      font-size: 1.25rem;
      font-weight: bold;
      color: #0ff;
      text-shadow: 0 0 8px #0ff;
      line-height: 1.2;
    }

    .live-hud .hud-item.high .value {
      color: #ffd700;
      text-shadow: 0 0 8px #ffd700;
    }

    .live-hud .hud-item.speed .value {
      color: #f0f;
      text-shadow: 0 0 8px #f0f;
    }

    .board-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
    }

    canvas#board {
      width: 100%;
      height: 100%;
      background: #05030a;
      border: 3px solid #0ff;
      border-radius: 10px;
      box-shadow: 0 0 15px #0ff, 0 0 30px rgba(0, 255, 255, 0.4), inset 0 0 20px rgba(0, 255, 255, 0.08);
      display: block;
      touch-action: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(5, 3, 10, 0.85);
      backdrop-filter: blur(2px);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      text-align: center;
      padding: 16px;
    }

    .overlay.hidden {
      display: none;
    }

    .overlay h2 {
      font-size: 1.5rem;
      color: #fff;
      text-shadow: 0 0 10px #f0f, 0 0 20px #f0f;
    }

    .overlay p {
      color: #ccc;
      font-size: 0.95rem;
    }

    button {
      padding: 10px 20px;
      border: 2px solid #0ff;
      background: rgba(0, 255, 255, 0.08);
      color: #0ff;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      border-radius: 6px;
      box-shadow: 0 0 8px rgba(0, 255, 255, 0.5);
      transition: all 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    button:hover {
      background: rgba(0, 255, 255, 0.2);
      box-shadow: 0 0 16px #0ff;
    }

    .pause-btn {
      min-width: 120px;
    }

    .pause-btn.hidden {
      display: none;
    }

    .side {
      width: min(280px, 92vw);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .panel {
      background: rgba(20, 8, 40, 0.7);
      border: 1px solid #f0f;
      border-radius: 8px;
      padding: 14px;
      box-shadow: 0 0 10px rgba(255, 0, 255, 0.35);
    }

    .panel h3 {
      font-size: 0.8rem;
      color: #d9a3ff;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .panel .value {
      font-size: 1.6rem;
      font-weight: bold;
      color: #0ff;
      text-shadow: 0 0 8px #0ff;
    }

    .panel.high .value {
      color: #ffd700;
      text-shadow: 0 0 8px #ffd700;
    }

    .panel.speed .value {
      color: #f0f;
      text-shadow: 0 0 8px #f0f;
    }

    .guide-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .guide-col h4 {
      font-size: 0.75rem;
      color: #0ff;
      margin-bottom: 6px;
      letter-spacing: 0.06em;
    }

    .controls-list {
      list-style: none;
      font-size: 0.8rem;
      line-height: 1.7;
      color: #cfc0e6;
    }

    .controls-list span {
      color: #0ff;
      font-weight: bold;
    }

    .dpad {
      display: grid;
      grid-template-columns: 64px 64px 64px;
      grid-template-rows: 64px 64px 64px;
      gap: 6px;
      justify-content: center;
      user-select: none;
    }

    .dpad button {
      width: 64px;
      height: 64px;
      padding: 0;
      font-size: 1.4rem;
      border-radius: 10px;
    }

    .dpad .up { grid-column: 2; grid-row: 1; }
    .dpad .left { grid-column: 1; grid-row: 2; }
    .dpad .right { grid-column: 3; grid-row: 2; }
    .dpad .down { grid-column: 2; grid-row: 3; }

    .dpad button:active {
      background: rgba(0, 255, 255, 0.35);
      transform: scale(0.96);
    }

    .name-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: min(220px, 80%);
      text-align: left;
    }

    .name-field label {
      font-size: 0.8rem;
      color: #d9a3ff;
    }

    .name-field input {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid #0ff;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.45);
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    .name-field input:focus {
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
    }

    .name-error {
      color: #ff6b9d;
      font-size: 0.8rem;
      min-height: 1.1em;
    }

    .rank-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.85rem;
      color: #cfc0e6;
    }

    .rank-list li {
      display: grid;
      grid-template-columns: 28px 1fr auto;
      gap: 8px;
      align-items: center;
    }

    .rank-list .rank {
      color: #ffd700;
      font-weight: bold;
    }

    .rank-list .name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .rank-list .pts {
      color: #0ff;
      font-weight: bold;
    }

    .rank-empty {
      color: #8a7a9e;
      font-size: 0.85rem;
    }

    @media (max-width: 759px) {
      body {
        padding: 10px 12px 24px;
      }

      h1.title {
        font-size: 1.2rem;
        margin-bottom: 8px;
      }

      .play-col {
        width: min(92vw, 58dvh);
        gap: 10px;
      }

      .live-hud {
        gap: 6px;
        padding: 6px 0;
      }

      .live-hud .hud-item {
        padding: 6px 8px;
      }

      .live-hud .value {
        font-size: 1.1rem;
      }

      .dpad {
        grid-template-columns: 56px 56px 56px;
        grid-template-rows: 56px 56px 56px;
        gap: 4px;
      }

      .dpad button {
        width: 56px;
        height: 56px;
        font-size: 1.2rem;
      }

      .pause-btn {
        min-width: 100px;
        padding: 8px 14px;
      }
    }

    @media (min-width: 760px) {
      .dpad {
        display: none;
      }

      .live-hud {
        position: static;
        background: transparent;
        backdrop-filter: none;
        padding: 0;
      }
    }
  </style>
</head>
<body>
  <h1 class="title">NEON SNAKE</h1>
  <div class="app">
    <div class="play-col">
      <div class="live-hud" aria-label="현재 상태">
        <div class="hud-item">
          <span class="label">점수</span>
          <span id="score" class="value">0</span>
        </div>
        <div class="hud-item high">
          <span class="label">최고</span>
          <span id="highScore" class="value">0</span>
        </div>
        <div class="hud-item speed">
          <span class="label">속도</span>
          <span id="speedLevel" class="value">1</span>
        </div>
      </div>
      <div class="board-wrap">
        <canvas id="board" width="400" height="400"></canvas>
        <div id="overlay" class="overlay">
          <h2>네온 스네이크</h2>
          <p>화려한 네온 세상에서 뱀을 키워보세요</p>
          <div class="name-field">
            <label for="playerName">플레이어 이름</label>
            <input id="playerName" type="text" maxlength="12" placeholder="이름 입력" autocomplete="nickname" />
            <div id="nameError" class="name-error"></div>
          </div>
          <button id="startBtn" type="button">시작하기</button>
        </div>
      </div>
      <button id="pauseBtn" class="pause-btn hidden" type="button">일시정지</button>
      <div class="dpad" aria-label="모바일 방향 조작">
        <button type="button" class="up" data-dir="up" aria-label="위">▲</button>
        <button type="button" class="left" data-dir="left" aria-label="왼쪽">◀</button>
        <button type="button" class="right" data-dir="right" aria-label="오른쪽">▶</button>
        <button type="button" class="down" data-dir="down" aria-label="아래">▼</button>
      </div>
    </div>

    <div class="side">
      <div class="panel">
        <h3>랭킹</h3>
        <ol id="rankList" class="rank-list"></ol>
        <p id="rankEmpty" class="rank-empty">아직 기록이 없어요</p>
      </div>
      <div class="panel">
        <h3>조작법</h3>
        <div class="guide-grid">
          <div class="guide-col">
            <h4>PC</h4>
            <ul class="controls-list">
              <li><span>방향키</span> 이동</li>
              <li><span>W A S D</span> 이동</li>
              <li><span>P / Esc</span> 일시정지</li>
              <li>황금 먹이 제한 시간!</li>
            </ul>
          </div>
          <div class="guide-col">
            <h4>모바일</h4>
            <ul class="controls-list">
              <li><span>화면 버튼</span> 이동</li>
              <li><span>스와이프</span> 이동</li>
              <li><span>일시정지</span> 버튼</li>
              <li>황금 먹이 제한 시간!</li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const COLS = 20;
    const ROWS = 20;
    const CELL = 20;
    const BASE_INTERVAL = 150;
    const MIN_INTERVAL = 60;
    const SPEED_STEP = 3;
    const BONUS_DURATION = 5000;
    const BONUS_SPAWN_CHANCE = 0.03;
    const RANK_KEY = "snakeRankings";
    const NAME_KEY = "snakePlayerName";
    const MAX_RANK = 10;

    const boardCanvas = document.getElementById("board");
    const boardCtx = boardCanvas.getContext("2d");
    const overlay = document.getElementById("overlay");
    const pauseBtn = document.getElementById("pauseBtn");
    const scoreEl = document.getElementById("score");
    const highScoreEl = document.getElementById("highScore");
    const speedLevelEl = document.getElementById("speedLevel");
    const rankListEl = document.getElementById("rankList");
    const rankEmptyEl = document.getElementById("rankEmpty");

    let snake = [];
    let dir = { x: 1, y: 0 };
    let nextDir = { x: 1, y: 0 };
    let food = null;
    let bonusFood = null;
    let particles = [];
    let floatingTexts = [];

    let score = 0;
    let foodCount = 0;
    let highScore = 0;
    let tickInterval = BASE_INTERVAL;
    let playerName = localStorage.getItem(NAME_KEY) || "";

    let running = false;
    let paused = false;
    let rafId = null;
    let lastFrameTime = 0;
    let tickAccumulator = 0;
    let pauseStartedAt = 0;
    let bonusPauseOffset = 0;

    function loadRankings() {
      try {
        const raw = JSON.parse(localStorage.getItem(RANK_KEY) || "[]");
        return Array.isArray(raw) ? raw : [];
      } catch (e) {
        return [];
      }
    }

    function saveRankings(list) {
      localStorage.setItem(RANK_KEY, JSON.stringify(list.slice(0, MAX_RANK)));
    }

    function addRanking(name, pts) {
      const list = loadRankings();
      list.push({ name: name, score: pts, at: Date.now() });
      list.sort(function (a, b) {
        if (b.score !== a.score) return b.score - a.score;
        return a.at - b.at;
      });
      saveRankings(list);
      renderRankings();
    }

    function renderRankings() {
      const list = loadRankings();
      highScore = list.length ? list[0].score : 0;
      highScoreEl.textContent = highScore;
      rankListEl.innerHTML = "";
      if (!list.length) {
        rankEmptyEl.style.display = "block";
        return;
      }
      rankEmptyEl.style.display = "none";
      list.forEach(function (entry, i) {
        const li = document.createElement("li");
        li.innerHTML =
          '<span class="rank">' + (i + 1) + "</span>" +
          '<span class="name"></span>' +
          '<span class="pts"></span>';
        li.querySelector(".name").textContent = entry.name;
        li.querySelector(".pts").textContent = entry.score;
        rankListEl.appendChild(li);
      });
    }

    function bindStartUi() {
      const startBtn = document.getElementById("startBtn");
      const nameInput = document.getElementById("playerName");
      if (nameInput) {
        nameInput.value = playerName;
        nameInput.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            e.preventDefault();
            startGame();
          }
        });
      }
      if (startBtn) startBtn.addEventListener("click", startGame);
    }

    function showStartScreen(message) {
      overlay.classList.remove("hidden");
      overlay.innerHTML =
        "<h2>네온 스네이크</h2>" +
        "<p>" + (message || "화려한 네온 세상에서 뱀을 키워보세요") + "</p>" +
        '<div class="name-field">' +
        '<label for="playerName">플레이어 이름</label>' +
        '<input id="playerName" type="text" maxlength="12" placeholder="이름 입력" autocomplete="nickname" />' +
        '<div id="nameError" class="name-error"></div>' +
        "</div>" +
        '<button id="startBtn" type="button">시작하기</button>';
      bindStartUi();
    }

    renderRankings();
    bindStartUi();

    function randomFreeCell(exclude) {
      let cell;
      let tries = 0;
      do {
        cell = {
          x: Math.floor(Math.random() * COLS),
          y: Math.floor(Math.random() * ROWS)
        };
        tries++;
      } while (
        tries < 500 &&
        (snake.some(function (s) { return s.x === cell.x && s.y === cell.y; }) ||
          (exclude && exclude.x === cell.x && exclude.y === cell.y))
      );
      return cell;
    }

    function resetState() {
      const startX = Math.floor(COLS / 2);
      const startY = Math.floor(ROWS / 2);
      snake = [
        { x: startX, y: startY },
        { x: startX - 1, y: startY },
        { x: startX - 2, y: startY },
        { x: startX - 3, y: startY }
      ];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      food = randomFreeCell(null);
      bonusFood = null;
      particles = [];
      floatingTexts = [];
      score = 0;
      foodCount = 0;
      tickInterval = BASE_INTERVAL;
      paused = false;
      bonusPauseOffset = 0;
      updateHud();
      updatePauseUi();
    }

    function updateHud() {
      scoreEl.textContent = score;
      highScoreEl.textContent = highScore;
      speedLevelEl.textContent = foodCount + 1;
    }

    function updatePauseUi() {
      if (!running) {
        pauseBtn.classList.add("hidden");
        return;
      }
      pauseBtn.classList.remove("hidden");
      pauseBtn.textContent = paused ? "계속하기" : "일시정지";
    }

    function showPauseOverlay() {
      overlay.classList.remove("hidden");
      overlay.innerHTML =
        "<h2>일시정지</h2>" +
        "<p>준비가 되면 계속하세요</p>" +
        '<button id="resumeBtn" type="button">계속하기</button>';
      document.getElementById("resumeBtn").addEventListener("click", resumeGame);
    }

    function spawnParticles(cell, color, count) {
      const cx = cell.x * CELL + CELL / 2;
      const cy = cell.y * CELL + CELL / 2;
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 0.06 + Math.random() * 0.12;
        particles.push({
          x: cx,
          y: cy,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 500 + Math.random() * 200,
          maxLife: 700,
          color: color
        });
      }
    }

    function spawnFloatingText(cell, text, color) {
      floatingTexts.push({
        x: cell.x * CELL + CELL / 2,
        y: cell.y * CELL + CELL / 2,
        text: text,
        color: color,
        life: 700,
        maxLife: 700
      });
    }

    function updateEffects(delta) {
      particles = particles.filter(function (p) {
        p.x += p.vx * delta;
        p.y += p.vy * delta;
        p.life -= delta;
        return p.life > 0;
      });
      floatingTexts = floatingTexts.filter(function (t) {
        t.y -= delta * 0.03;
        t.life -= delta;
        return t.life > 0;
      });
    }

    function willCollide(head, growing) {
      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return true;
      const bodyToCheck = growing ? snake : snake.slice(0, -1);
      return bodyToCheck.some(function (seg) {
        return seg.x === head.x && seg.y === head.y;
      });
    }

    function tick(time) {
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      const eatingFood = food && head.x === food.x && head.y === food.y;
      const eatingBonus = bonusFood && head.x === bonusFood.x && head.y === bonusFood.y;
      const growing = eatingFood || eatingBonus;

      if (willCollide(head, growing)) {
        endGame();
        return;
      }

      snake.unshift(head);

      if (eatingFood) {
        score += 10;
        foodCount++;
        tickInterval = Math.max(MIN_INTERVAL, BASE_INTERVAL - foodCount * SPEED_STEP);
        spawnParticles(head, "#0ff", 10);
        spawnFloatingText(head, "+10", "#0ff");
        food = randomFreeCell(bonusFood);
      } else if (eatingBonus) {
        score += 50;
        spawnParticles(head, "#ffd700", 18);
        spawnFloatingText(head, "+50", "#ffd700");
        bonusFood = null;
      } else {
        snake.pop();
      }

      if (score > highScore) {
        highScore = score;
        localStorage.setItem("snakeHighScore", String(highScore));
      }

      if (bonusFood && time - bonusFood.spawnTime > bonusFood.duration) {
        bonusFood = null;
      }

      if (!bonusFood && Math.random() < BONUS_SPAWN_CHANCE) {
        const cell = randomFreeCell(food);
        bonusFood = {
          x: cell.x,
          y: cell.y,
          spawnTime: time,
          duration: BONUS_DURATION
        };
      }

      updateHud();
    }

    function drawGrid() {
      boardCtx.strokeStyle = "rgba(0, 255, 255, 0.05)";
      boardCtx.lineWidth = 1;
      for (let x = 0; x <= COLS; x++) {
        boardCtx.beginPath();
        boardCtx.moveTo(x * CELL, 0);
        boardCtx.lineTo(x * CELL, ROWS * CELL);
        boardCtx.stroke();
      }
      for (let y = 0; y <= ROWS; y++) {
        boardCtx.beginPath();
        boardCtx.moveTo(0, y * CELL);
        boardCtx.lineTo(COLS * CELL, y * CELL);
        boardCtx.stroke();
      }
    }

    function drawFood(time) {
      if (!food) return;
      const cx = food.x * CELL + CELL / 2;
      const cy = food.y * CELL + CELL / 2;
      const pulse = 1 + Math.sin(time / 150) * 0.15;
      boardCtx.save();
      boardCtx.shadowColor = "#ff2d95";
      boardCtx.shadowBlur = 14;
      boardCtx.fillStyle = "#ff2d95";
      boardCtx.beginPath();
      boardCtx.arc(cx, cy, (CELL / 2 - 3) * pulse, 0, Math.PI * 2);
      boardCtx.fill();
      boardCtx.restore();
    }

    function drawBonus(time) {
      if (!bonusFood) return;
      const cx = bonusFood.x * CELL + CELL / 2;
      const cy = bonusFood.y * CELL + CELL / 2;
      const remaining = 1 - (time - bonusFood.spawnTime) / bonusFood.duration;
      const blinkFast = remaining < 0.3;
      const alpha = blinkFast ? (Math.sin(time / 60) > 0 ? 1 : 0.3) : 1;

      boardCtx.save();
      boardCtx.globalAlpha = alpha;
      boardCtx.shadowColor = "#ffd700";
      boardCtx.shadowBlur = 18;
      boardCtx.fillStyle = "#ffd700";
      boardCtx.beginPath();
      boardCtx.arc(cx, cy, CELL / 2 - 2, 0, Math.PI * 2);
      boardCtx.fill();

      boardCtx.globalAlpha = 1;
      boardCtx.strokeStyle = "#fff8dc";
      boardCtx.lineWidth = 3;
      boardCtx.beginPath();
      boardCtx.arc(cx, cy, CELL / 2 + 2, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.max(0, remaining));
      boardCtx.stroke();
      boardCtx.restore();
    }

    function drawSnake() {
      const len = snake.length;
      snake.forEach(function (seg, i) {
        const hue = 190 + (i / Math.max(1, len - 1)) * 90;
        const isHead = i === 0;
        const px = seg.x * CELL;
        const py = seg.y * CELL;

        boardCtx.save();
        boardCtx.shadowColor = "hsl(" + hue + ", 100%, 60%)";
        boardCtx.shadowBlur = isHead ? 16 : 8;
        boardCtx.fillStyle = "hsl(" + hue + ", 100%, " + (isHead ? 65 : 55) + "%)";
        const pad = isHead ? 1 : 2;
        const radius = 5;
        const x = px + pad;
        const y = py + pad;
        const size = CELL - pad * 2;
        boardCtx.beginPath();
        boardCtx.moveTo(x + radius, y);
        boardCtx.arcTo(x + size, y, x + size, y + size, radius);
        boardCtx.arcTo(x + size, y + size, x, y + size, radius);
        boardCtx.arcTo(x, y + size, x, y, radius);
        boardCtx.arcTo(x, y, x + size, y, radius);
        boardCtx.closePath();
        boardCtx.fill();
        boardCtx.restore();

        if (isHead) {
          boardCtx.save();
          boardCtx.fillStyle = "#05030a";
          const eyeOffsetX = dir.x !== 0 ? dir.x * 4 : 0;
          const eyeOffsetY = dir.y !== 0 ? dir.y * 4 : 0;
          const perpX = dir.y !== 0 ? 4 : 0;
          const perpY = dir.x !== 0 ? 4 : 0;
          const cx = px + CELL / 2;
          const cy = py + CELL / 2;
          boardCtx.beginPath();
          boardCtx.arc(cx + eyeOffsetX + perpX, cy + eyeOffsetY + perpY, 1.6, 0, Math.PI * 2);
          boardCtx.arc(cx + eyeOffsetX - perpX, cy + eyeOffsetY - perpY, 1.6, 0, Math.PI * 2);
          boardCtx.fill();
          boardCtx.restore();
        }
      });
    }

    function drawParticles() {
      particles.forEach(function (p) {
        const alpha = Math.max(0, p.life / p.maxLife);
        boardCtx.save();
        boardCtx.globalAlpha = alpha;
        boardCtx.shadowColor = p.color;
        boardCtx.shadowBlur = 8;
        boardCtx.fillStyle = p.color;
        boardCtx.beginPath();
        boardCtx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
        boardCtx.fill();
        boardCtx.restore();
      });
    }

    function drawFloatingTexts() {
      floatingTexts.forEach(function (t) {
        const alpha = Math.max(0, t.life / t.maxLife);
        boardCtx.save();
        boardCtx.globalAlpha = alpha;
        boardCtx.fillStyle = t.color;
        boardCtx.shadowColor = t.color;
        boardCtx.shadowBlur = 8;
        boardCtx.font = "bold 13px sans-serif";
        boardCtx.textAlign = "center";
        boardCtx.fillText(t.text, t.x, t.y);
        boardCtx.restore();
      });
    }

    function draw(time) {
      boardCtx.fillStyle = "#05030a";
      boardCtx.fillRect(0, 0, boardCanvas.width, boardCanvas.height);
      drawGrid();
      drawFood(time);
      drawBonus(time);
      drawSnake();
      drawParticles();
      drawFloatingTexts();
    }

    function endGame() {
      running = false;
      paused = false;
      if (rafId) cancelAnimationFrame(rafId);
      updatePauseUi();
      addRanking(playerName, score);
      showStartScreen(playerName + "님 점수 " + score + "점! 최고 " + highScore + "점");
      const restartBtn = document.createElement("button");
      restartBtn.id = "restartBtn";
      restartBtn.type = "button";
      restartBtn.textContent = "같은 이름으로 다시";
      overlay.appendChild(restartBtn);
      restartBtn.addEventListener("click", startGame);
    }

    function startGame() {
      const nameInput = document.getElementById("playerName");
      const nameError = document.getElementById("nameError");
      const name = nameInput ? nameInput.value.trim() : playerName.trim();
      if (!name) {
        if (nameError) nameError.textContent = "이름을 입력해주세요";
        if (nameInput) nameInput.focus();
        return;
      }
      playerName = name.slice(0, 12);
      localStorage.setItem(NAME_KEY, playerName);
      if (nameError) nameError.textContent = "";
      resetState();
      overlay.classList.add("hidden");
      running = true;
      lastFrameTime = 0;
      tickAccumulator = 0;
      updatePauseUi();
      if (rafId) cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(loop);
    }

    function pauseGame() {
      if (!running || paused) return;
      paused = true;
      pauseStartedAt = performance.now();
      updatePauseUi();
      showPauseOverlay();
    }

    function resumeGame() {
      if (!running || !paused) return;
      const pauseDuration = performance.now() - pauseStartedAt;
      if (bonusFood) {
        bonusFood.spawnTime += pauseDuration;
      }
      paused = false;
      lastFrameTime = 0;
      tickAccumulator = 0;
      overlay.classList.add("hidden");
      updatePauseUi();
      if (rafId) cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(loop);
    }

    function togglePause() {
      if (!running) return;
      if (paused) resumeGame();
      else pauseGame();
    }

    function loop(time) {
      if (!running) return;
      if (paused) {
        draw(time);
        return;
      }

      const delta = lastFrameTime ? time - lastFrameTime : 0;
      lastFrameTime = time;
      tickAccumulator += delta;

      if (tickAccumulator >= tickInterval) {
        tickAccumulator = 0;
        tick(time);
        if (!running) return;
      }

      updateEffects(delta);
      draw(time);
      rafId = requestAnimationFrame(loop);
    }

    function setDirection(x, y) {
      if (!running || paused) return;
      if (dir.x === -x && dir.y === -y) return;
      nextDir = { x: x, y: y };
    }

    function handleDirKey(key) {
      switch (key) {
        case "ArrowUp":
        case "w":
        case "W":
          setDirection(0, -1);
          return true;
        case "ArrowDown":
        case "s":
        case "S":
          setDirection(0, 1);
          return true;
        case "ArrowLeft":
        case "a":
        case "A":
          setDirection(-1, 0);
          return true;
        case "ArrowRight":
        case "d":
        case "D":
          setDirection(1, 0);
          return true;
        default:
          return false;
      }
    }

    document.addEventListener("keydown", function (e) {
      if (e.key === "p" || e.key === "P" || e.key === "Escape") {
        if (running) {
          e.preventDefault();
          togglePause();
        }
        return;
      }
      if (!running || paused) return;
      if (handleDirKey(e.key)) e.preventDefault();
    });

    document.querySelectorAll(".dpad button").forEach(function (btn) {
      btn.addEventListener("pointerdown", function (e) {
        e.preventDefault();
        const map = {
          up: [0, -1],
          down: [0, 1],
          left: [-1, 0],
          right: [1, 0]
        };
        const dirKey = btn.getAttribute("data-dir");
        const d = map[dirKey];
        if (d) setDirection(d[0], d[1]);
      });
    });

    let touchStartX = 0;
    let touchStartY = 0;

    boardCanvas.addEventListener("touchstart", function (e) {
      if (!running || paused) return;
      const t = e.changedTouches[0];
      touchStartX = t.clientX;
      touchStartY = t.clientY;
    }, { passive: true });

    boardCanvas.addEventListener("touchend", function (e) {
      if (!running || paused) return;
      const t = e.changedTouches[0];
      const dx = t.clientX - touchStartX;
      const dy = t.clientY - touchStartY;
      if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
      if (Math.abs(dx) > Math.abs(dy)) {
        setDirection(dx > 0 ? 1 : -1, 0);
      } else {
        setDirection(0, dy > 0 ? 1 : -1);
      }
    }, { passive: true });

    pauseBtn.addEventListener("click", togglePause);

    resetState();
    draw(0);
  </script>
</body>
</html>
